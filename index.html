<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>请在浏览器打开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
.wrap{background:#fff;text-align:center;padding:60px 20px;}
.tip-box{background:#f5f7fa;border-radius:16px;padding:30px 20px;}
h2{color:#222;font-size:20px;margin-bottom:16px;}
p{color:#555;font-size:16px;line-height:1.7;margin-bottom:12px;}
.copy-url{background:#eee;padding:12px;border-radius:8px;word-break:break-all;margin:20px 0;font-size:14px;color:#222;}
#copyBtn{background:#007aff;color:#fff;border:none;padding:14px 28px;border-radius:10px;font-size:17px;}
.normal-jump{display:none;}
</style>
</head>
<body>
<div class="wrap">
    <!-- 微信环境 提示引导区域 -->
    <div id="wxTip">
        <div class="tip-box">
            <h2>当前在微信内置浏览器</h2>
            <p>微信限制无法直接打开页面，请手动操作：</p>
            <p>方法①：点右上角 ⋮ → <b>用其他应用打开</b>，选择浏览器</p>
            <p>方法②：复制下面链接，打开手机浏览器粘贴访问</p>
            <div class="copy-url" id="targetUrl">https://vlink.cc/sisiyyiyi</div>
            <button id="copyBtn">复制链接</button>
        </div>
    </div>
    <!-- 非微信环境：自动跳转 -->
    <div id="normalPage" class="normal-jump">
        <p>页面正在跳转...</p>
        <p>如无跳转，请<a href="https://vlink.cc/sisiyyiyi">点击这里</a></p>
    </div>
</div>

<script>
const targetUrl = "https://vlink.cc/sisiyyiyi";
const ua = navigator.userAgent.toLowerCase();
const isWeChat = ua.indexOf("micromessenger") !== -1;

if(isWeChat){
    //微信内：显示引导页面
    document.getElementById("wxTip").style.display="block";
    document.getElementById("normalPage").style.display="none";
    document.getElementById("targetUrl").innerText = targetUrl;
    //复制按钮
    document.getElementById("copyBtn").onclick = async function(){
        try{
            await navigator.clipboard.writeText(targetUrl);
            alert("链接已复制！打开浏览器粘贴访问");
        }catch(e){
            alert("复制失败，请手动长按复制链接");
        }
    }
}else{
    //非微信，直接自动跳转
    document.getElementById("wxTip").style.display="none";
    document.getElementById("normalPage").style.display="block";
    window.location.href = targetUrl;
}
</script>
</body>
</html>
